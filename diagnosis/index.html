<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 읽기 진단 1·2단계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap">
<style>
/* 아이가 자기 휴대폰으로 혼자 푸는 진단. 한 화면에 한 문제, 러시아어 안내를 함께. 선생님 화면은 결과 코드를 모아 보는 곳 */
:root{
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --ink:#1D2430;
  --muted:#5A6472;
  --line:#CDD4DD;
  --accent:#2F5D8A;
  --accent-soft:#E2EBF5;
  --ok:#2E7D4F;
  --warn:#B4532A;
  --warn-soft:#FBEDE6;
  --display:'Jua','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--accent);color:#fff;font-size:14px}
.bar.teacher{background:#E6E9ED;color:var(--muted);border-bottom:1px solid var(--line)}
.prog{flex:1;max-width:260px;height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff}
main{max-width:860px;margin:0 auto;padding:20px 16px 130px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:32px}
h2{font-size:26px}
h3{margin:0;font-size:19px}
p{margin:0}
.ru{color:#36506B;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.ru-first{border-left:6px solid var(--accent)}
.note{font-size:15px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:50px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);font-weight:700}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.skip{border-color:var(--line);color:var(--muted)}
.btn.skip[aria-pressed=true]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:8px 0;font-size:14px;align-self:flex-start}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(244,246,248,.97);border-top:1px solid var(--line);padding:10px 16px}
.foot .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text],textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:50px;font-size:18px}
textarea{min-height:120px;resize:vertical;font-size:15px;width:100%}
ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.passage{font-size:28px;line-height:2;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:20px 22px}
.q{font-size:24px;font-weight:700;line-height:1.45;flex:1;min-width:240px}
.qid{display:inline-block;font-size:14px;color:var(--accent);font-weight:700;margin-right:8px}
.sent{font-size:25px;line-height:1.7;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px 18px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{position:relative;min-height:160px;border:2px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:26px 8px 8px}
.choice .n{position:absolute;top:6px;left:10px;font-size:20px;font-weight:700}
.choice img{max-width:100%;height:130px;object-fit:contain}
.choice svg{width:170px;height:128px}
.choice .t{font-size:26px;font-weight:700}
.choice.textonly{min-height:84px}
.choice.textonly .t{font-size:22px}
.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:#F7FAFD}
.speak{display:inline-flex;align-items:center;gap:8px}
.speak svg{width:22px;height:22px}
.bigplay{min-height:90px;font-size:22px;padding:14px 28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:14px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:#E3F2E9;color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.wrap{overflow-x:auto}
.item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:56px;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted)}
.dialog{position:fixed;inset:0;background:rgba(29,36,48,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.done-mark{width:72px;height:72px;border-radius:50%;background:#E3F2E9;color:var(--ok);display:flex;align-items:center;justify-content:center}
@media (max-width:560px){
  .choice{min-height:130px}
  .choice img{height:100px}
  .choice svg{width:130px;height:98px}
  .q{font-size:21px}
  .sent{font-size:21px}
  .passage{font-size:23px}
  h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- 소리 (기기의 한국어 음성) ---------- */
function say(text){
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.85;
      const v = speechSynthesis.getVoices().find(v => /ko/i.test(v.lang)); if(v) u.voice = v;
      speechSynthesis.speak(u); return true;
    }
  }catch(e){}
  return false;
}

/* ---------- 순서 ---------- */
const idsOf = story => DATA.items.filter(i => i.story===story).map(i => i.id);
function buildSteps(){
  const listen = S.version==='A' ? 'g' : 'n', read = S.version==='A' ? 'n' : 'g';
  const st = [{k:'welcome'},{k:'readintro1'},{k:'passage'}];
  ['R-1','R-2'].forEach(id => st.push({k:'item',id}));
  st.push({k:'part',t:'pic'});
  ['B-1','B-2','B-3','B-4','B-5','B-6','B-7','B-8','B-9','B-10'].forEach(id => st.push({k:'item',id}));
  st.push({k:'part',t:'sent'});
  ['L-1','L-2','L-3','L-4'].forEach(id => st.push({k:'item',id}));
  st.push({k:'part',t:'listen'});
  st.push({k:'listen',story:listen});
  idsOf(listen).forEach(id => st.push({k:'item',id,mode:'listen'}));
  st.push({k:'story',story:read});
  idsOf(read).forEach(id => st.push({k:'item',id,mode:'read'}));
  st.push({k:'checkpoint'});
  st.push({k:'finish'});
  return st;
}
function addRecheck(){
  const at = steps.findIndex(s => s.k==='checkpoint');
  const ex = [{k:'part',t:'more'},{k:'listen',story:'d'}];
  idsOf('d').forEach(id => ex.push({k:'item',id,mode:'listen'}));
  ex.push({k:'story',story:'r'});
  idsOf('r').forEach(id => ex.push({k:'item',id,mode:'read'}));
  steps.splice(at+1,0,...ex);
}

/* ---------- 채점 ---------- */
function score(r){
  const right = id => r.ans[id] === ITEMS[id].a;
  const skip = id => r.ans[id] === SKIP;
  const cnt = ids => ids.filter(right).length;
  const v = cnt(['B-1','B-2','B-3','B-4','B-5']), s = cnt(['B-6','B-7','B-8','B-9','B-10']);
  const listen = r.version==='A'?'g':'n', read = r.version==='A'?'n':'g';
  const L = cnt(idsOf(listen)), R = cnt(idsOf(read)), L2 = cnt(idsOf('d')), R2 = cnt(idsOf('r'));
  const rq = cnt(['R-1','R-2']);
  const mismatch = (L===2 && R<=1) || (R===2 && L<=1);
  const lt = r.recheck ? L+L2 : L, rt = r.recheck ? R+R2 : R;
  const good = x => x >= (r.recheck ? 3 : 2);
  const noSnd = r.noSound && (r.noSound[listen] || r.noSound.d);
  let hl;
  if(noSnd) hl = '소리가 나지 않아 듣기 결과는 참고만 해요';
  else if(good(lt) && !good(rt)) hl = '들으면 이해하지만 읽으면 뜻을 놓쳐요 → 읽기 유창성 지원이 먼저';
  else if(!good(lt) && !good(rt)) hl = '듣기와 읽기 모두 어려워요 → 어휘·문장 지원이 먼저';
  else if(good(rt) && !good(lt)) hl = '읽으면 이해하지만 듣기에서 놓쳐요 → 듣기 상황(집중, 소리)을 한 번 더 살펴보기';
  else hl = '짧은 이야기는 듣기·읽기 모두 이해해요 → 문장 길이 사다리에서 막힌 구조를 다음 목표로';
  /* 통과 기준: 어휘·문장 각각 80점 이상(5개 중 4개) */
  const pass = v>=4 && s>=4;
  const verdict = pass ? '통과 · 2차 진단 필요' : '기초 수준부터 시작';
  let route;
  if(pass) route = {lvl:'ok', text:'2차 진단으로 진행'};
  else if(v>=4) route = {lvl:'mid', text:'기초 수준: 어휘는 통과, 문장부터 학습'};
  else if(s>=4) route = {lvl:'mid', text:'기초 수준: 문장은 통과, 어휘부터 학습'};
  else route = {lvl:'warn', text:'기초 수준: 어휘·문장 모두 학습'};
  const border = !pass && (v===3 || s===3) && v>=3 && s>=3;
  let lad = 0; for(const id of ['L-1','L-2','L-3','L-4']){ if(right(id)) lad++; else break; }
  const sec = r.readSec;
  let line;
  if(sec!=null && sec<5) line = '글을 너무 빨리 넘김 (녹음으로 읽기 확인 필요)';
  else if(sec!=null && sec>40 && rq===2) line = '읽기는 느렸지만 내용은 이해함';
  else if(sec!=null && sec>40) line = '읽는 데 시간이 걸리고 내용을 놓침';
  else if(rq<2) line = '빨리 읽었지만 내용 질문을 틀림 (어휘·문장 확인 필요)';
  else line = '짧은 글을 읽고 내용을 이해함';
  const skips = Object.keys(r.ans).filter(skip).length;
  return {v,s,L,R,L2,R2,rq,mismatch,hl,route,lad,line,skips,right,pass,verdict,border,vScore:v*20,sScore:s*20,total:(v+s)*10};
}

/* ---------- 결과 코드 ---------- */
function encodeResult(r){
  const o = {v:1,id:r.id,n:r.name,ver:r.version,t:r.started,sec:r.readSec!=null?Math.round(r.readSec):null,a:r.ans,rc:r.recheck?1:0,pl:r.plays,ns:Object.keys(r.noSound).filter(k=>r.noSound[k])};
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin=''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function decodeResult(code){
  const bin = atob(String(code).trim());
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const o = JSON.parse(new TextDecoder().decode(bytes));
  const ns = {}; (o.ns||[]).forEach(k => ns[k]=true);
  return {id:o.id||'', name:o.n||'', version:o.ver, started:o.t, readSec:o.sec, ans:o.a||{}, recheck:!!o.rc, noSound:ns, plays:o.pl||{}};
}

/* ---------- 분석 (학생 제출 때와 선생님 화면에서 같이 씀) ---------- */
function makeReport(r){
  const sc = score(r);
  const optLabel = (it,c) => c===SKIP ? '모르겠어요' : c==null ? '-' : NUM[c] + (it.o[c].text ? ' '+it.o[c].text : '');
  const wrong = ORDER.filter(id => r.ans[id]!=null && !sc.right(id)).map(id => {
    const it = ITEMS[id], c = r.ans[id];
    return {id, label:optLabel(it,c), meaning: c===SKIP ? '모른다고 답함' : (it.w[String(c)] || it.d || '내용을 놓침')};
  });
  const ladderWrong = ['L-1','L-2','L-3','L-4'].filter(id => !sc.right(id)).map(id => ({id, chose:optLabel(ITEMS[id], r.ans[id]), structure:ITEMS[id].st, meaning: r.ans[id]===SKIP?'모른다고 답함':(ITEMS[id].w[String(r.ans[id])]||ITEMS[id].d)}));
  const listenStory = r.version==='A'?'g':'n';
  return {id:r.id, name:r.name, version:r.version, date:new Date(r.started||Date.now()).toISOString().slice(0,10),
    readSec:r.readSec, rq:sc.rq, line:sc.line, v:sc.v, s:sc.s, route:sc.route, pass:sc.pass, verdict:sc.verdict, border:sc.border, vScore:sc.vScore, sScore:sc.sScore, total:sc.total, lad:sc.lad, ladderWrong,
    L:sc.L, R:sc.R, L2:sc.L2, R2:sc.R2, recheck:r.recheck, hl:sc.hl, skips:sc.skips, wrong,
    plays:r.plays||{}, listenStory, raw:r, oral:{wrong:[],wrongE:[],sec:null,style:''}};
}
function submitPayload(){
  const rep = makeReport(S);
  const answers = {};
  ORDER.forEach(id => { const a = S.ans[id]; answers[id] = a==null ? '' : a===SKIP ? '모름' : (a+1) + (a===ITEMS[id].a ? '' : ' ✗'); });
  return {
    action:'submit', id:S.id, name:S.name, version: S.version==='A'?'가형':'나형',
    verdict: rep.verdict + (rep.border ? ' (경계: 녹음 보고 판단)' : ''), vScore: rep.vScore, sScore: rep.sScore, total: rep.total,
    readSec: rep.readSec, rq: rep.rq, v: rep.v, s: rep.s, route: rep.route.text,
    ladder: 'L-'+rep.lad, listen: rep.L, read: rep.R,
    listen2: rep.recheck ? rep.L2 : '', read2: rep.recheck ? rep.R2 : '',
    plays: (rep.plays[rep.listenStory]||0) + (rep.recheck ? ' / 확인 '+(rep.plays.d||0) : ''),
    skips: rep.skips, line: rep.line, hl: rep.hl,
    wrong: rep.wrong.map(x => `${x.id} ${x.label}: ${x.meaning}`).join('\n'),
    answers, code: encodeResult(S)
  };
}
async function postJSON(body){
  const res = await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify(body)});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'error');
  return j;
}

function oralResult(r){
  const o = r.oral; if(!o || (o.sec==null && !o.wrong.length && !o.style)) return null;
  const byG = [0,1,2].map(g => 5 - o.wrong.filter(i => Math.floor(i/5)===g).length);
  const slow = o.style==='글자' || (o.sec!=null && o.sec>40);
  let type='다', name='비교적 유창함';
  if(byG[1] <= 2){ type='가'; name='해독이 어려움'; }
  else if(slow){ type='나'; name='읽기는 되지만 느림'; }
  let line;
  if(type==='가') line = '받침 낱말에서 자주 멈춤 (' + o.wrong.filter(i=>i>=5).map(i=>CARD_WORDS[i]).join(', ') + ')';
  else if(slow && r.rq===2) line = '소리 내어 읽기는 느렸지만 내용은 이해함';
  else if(slow) line = '읽는 데 힘을 쓰느라 내용을 놓침';
  else if(r.rq<2) line = '정확히 읽었지만 내용 질문을 틀림 (어휘·문장 확인 필요)';
  else line = '비교적 유창하게 읽고 내용을 이해함';
  return {byG,type,name,line,words:o.wrong.map(i=>CARD_WORDS[i])};
}

      <p class="note">결과는 구글 시트 ‘결과’ 탭에도 자동으로 쌓여요. 여기서는 아이를 눌러 자세한 분석을 보고, 녹음을 들으며 기록할 수 있어요.</p></div>
    <h3>제출한 학생</h3>${list}
    <details class="card"><summary><b>코드로 열기</b> <span class="note">(인터넷이 안 될 때 아이가 보낸 코드를 붙여 넣기)</span></summary>
      <textarea id="paste" placeholder="<<...>>"></textarea>
      <div class="row"><button class="btn" data-act="import">결과 보기</button></div><p class="status" id="impstat"></p></details>`;
  setFoot('<button class="btn" data-act="tostudent">학생 화면 보기</button>','');
}
async function loadList(){
  listState='loading'; renderTeacher();
  try{
    const res = await fetch(SCRIPT_URL + '?action=list&key=' + encodeURIComponent(tkey));
    const j = await res.json();
    if(!j.ok) throw new Error(j.error);
    listCache = j.results || []; oralMap = j.oral || {};
    listState='ok';
  }catch(e){ listState='err'; }
  renderTeacher();
}
function oralCard(r){
  const o = r.oral;
  const res = oralResult(r);
  const EO = PASSAGE.split(' ');
  return `<div class="card"><h3>녹음 듣고 기록하기 (소리 내어 읽기)</h3>
    <p class="note">아이가 보낸 음성 메시지를 들으면서 <b>틀리게 읽거나 3초 넘게 멈춘</b> 낱말과 어절을 눌러요. 글을 읽은 시간도 적어 주세요.</p>
    ${[0,1,2].map(g=>`<p class="note">${GROUPS[g]}</p><div class="row">${CARD_WORDS.slice(g*5,g*5+5).map((w,j)=>{const i=g*5+j;return `<button class="btn skip" data-act="ow" data-i="${i}" aria-pressed="${o.wrong.includes(i)}">${w}</button>`;}).join('')}</div>`).join('')}
    <p class="note">짧은 글 (틀린 어절 ${o.wrongE.length} / 15)</p>
    <div class="row">${EO.map((e,i)=>`<button class="btn skip" style="min-height:40px;padding:4px 10px" data-act="oe" data-i="${i}" aria-pressed="${o.wrongE.includes(i)}">${esc(e)}</button>`).join('')}</div>
    <div class="row"><label class="f" for="osec" style="flex:0 0 200px">글 읽은 시간 (초)<input id="osec" type="text" inputmode="numeric" value="${o.sec??''}"></label>
      <div class="f">읽는 모습<div class="row">${['글자','낱말','문장'].map(x=>`<button class="btn skip" data-act="ostyle" data-v="${x}" aria-pressed="${o.style===x}">${x==='글자'?'글자 하나씩':x==='낱말'?'낱말 단위':'문장 단위로 자연스럽게'}</button>`).join('')}</div></div></div>
    ${res ? `<p><span class="pill ${res.type==='가'?'warn':res.type==='다'?'ok':''}">읽기 유형 ${res.type} · ${res.name}</span></p><p style="font-size:18px">${esc(res.line)}</p>
      <p class="note">낱말 ${res.byG.join(' / ')} (받침 없음 / 있음 / 소리 바뀜, 각 5개 중)</p>` : '<p class="note">기록하면 읽기 유형(가·나·다)과 종합 한 줄이 나와요.</p>'}
    <label class="f" for="memo">메모<textarea id="memo">${esc(r.note||'')}</textarea></label>
    <div class="row"><button class="btn primary" data-act="saveoral"${configured()?'':' disabled'}>녹음 기록을 시트에 저장</button><span class="status" id="savestat"></span></div></div>`;
}
function renderReport(app, r){
  setBar('결과 · ' + (r.name||''));
  const rc = r.route.lvl==='ok'?'ok':r.route.lvl==='warn'?'warn':'';
  app.innerHTML = `
  <div class="row" style="justify-content:space-between"><h2>${esc(r.name||'이름 없음')}</h2><span class="status">${esc(r.date)} · ${r.version==='A'?'가형':'나형'}</span></div>
  <div class="card"><h3>판정 <span class="note">(어휘·문장 각각 80점 이상이면 통과)</span></h3>
    <p><span class="pill ${r.pass?'ok':'warn'}" style="font-size:18px;padding:4px 14px">${esc(r.verdict)}</span></p>
    ${r.border?'<p class="note">한 영역이 60점(5개 중 3개)이라 경계에 있어요. 소리 내어 읽기 녹음을 듣고, 비교적 매끄러우면 2차 진단을 해 보세요.</p>':''}</div>
  <div class="tiles">
    <div class="tile"><span class="k">어휘 B-1~5</span><span class="v">${r.vScore}점</span><span class="note">${r.v} / 5</span></div>
    <div class="tile"><span class="k">문장 B-6~10</span><span class="v">${r.sScore}점</span><span class="note">${r.s} / 5</span></div>
    <div class="tile"><span class="k">‘모르겠어요’</span><span class="v">${r.skips}</span></div>
    <div class="tile"><span class="k">다음 단계</span><span class="pill ${rc}" style="font-size:15px">${esc(r.route.text)}</span></div>
  </div>
  <div class="card"><h3>종합</h3><p style="font-size:19px">${esc(r.line)}</p><p>${esc(r.hl)}</p></div>
  <div class="card"><h3>짧은 글 속으로 읽기</h3>
    <div class="wrap"><table><tbody>
      <tr><th>읽은 시간</th><td>${r.readSec!=null? r.readSec+'초':'-'} <span class="note">(15어절, 임시 기준 40초)</span></td></tr>
      <tr><th>내용 질문</th><td>${r.rq} / 2</td></tr>
    </tbody></table></div></div>
  <div class="card"><h3>문장 길이 사다리</h3><p>연속으로 맞힌 문장: L-${r.lad} 까지</p>
    ${r.ladderWrong.length ? `<div class="wrap"><table><thead><tr><th>문항</th><th>고른 답</th><th>새로 붙은 구조</th><th>오답이 알려 주는 것</th></tr></thead><tbody>
    ${r.ladderWrong.map(x=>`<tr><td>${x.id}</td><td>${esc(x.chose)}</td><td>${esc(x.structure)}</td><td>${esc(x.meaning)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">4문항 모두 맞혔어요.</p>'}</div>
  <div class="card"><h3>듣기·읽기 비교</h3>
    <div class="wrap"><table><thead><tr><th></th><th>듣기</th><th>읽기</th></tr></thead><tbody>
      <tr><td>처음 이야기</td><td>${r.L} / 2</td><td>${r.R} / 2</td></tr>
      ${r.recheck?`<tr><td>확인 이야기</td><td>${r.L2} / 2</td><td>${r.R2} / 2</td></tr>`:''}
    </tbody></table></div>
    <p class="note">이야기 들은 횟수: 처음 ${r.plays[r.listenStory]||0}번${r.recheck?`, 확인 ${r.plays.d||0}번`:''} (두 번 듣기 안내)</p></div>
  <div class="card"><h3>틀리거나 ‘모르겠어요’ 한 문항</h3>
    ${r.wrong.length ? `<div class="wrap"><table><thead><tr><th>문항</th><th>답</th><th>알려 주는 것</th></tr></thead><tbody>
    ${r.wrong.map(x=>`<tr><td>${x.id}</td><td>${esc(x.label)}</td><td>${esc(x.meaning)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">없어요.</p>'}</div>
  ${oralCard(r)}`;
  setFoot('<button class="btn" data-act="tlist">목록으로</button>', '');
}
function keepTeacherInputs(){
  if(!curReport) return;
  const m=$('#memo'); if(m) curReport.note=m.value;
  const s=$('#osec'); if(s){ const v=parseFloat(s.value); curReport.oral.sec = isNaN(v)?null:Math.round(v); }
}
async function saveOral(){
  keepTeacherInputs();
  const r = curReport, o = r.oral, res = oralResult(r), st = $('#savestat');
  st.textContent = '저장하는 중…';
  try{
    await postJSON({action:'oral', key:tkey, id:r.id, name:r.name,
      wrongWords: o.wrong.map(i=>CARD_WORDS[i]).join(', '),
      groups: res ? res.byG.join(' / ') : '', sec: o.sec ?? '', wrongE: o.wrongE.length + ' / 15',
      style: o.style==='글자'?'글자 하나씩':o.style==='낱말'?'낱말 단위':o.style==='문장'?'문장 단위':'',
      type: res ? res.type+' ('+res.name+')' : '', line: res ? res.line : '', note: r.note||'',
      raw: JSON.stringify({wrong:o.wrong, wrongE:o.wrongE, sec:o.sec, style:o.style})});
    oralMap[r.id] = {type: res ? res.type : '', raw: {wrong:o.wrong, wrongE:o.wrongE, sec:o.sec, style:o.style}, note:r.note};
    $('#savestat').textContent = '시트의 ‘녹음 기록’ 탭에 저장했어요.';
  }catch(e){ $('#savestat').textContent = '저장하지 못했어요. 선생님 키와 인터넷 연결을 확인해 주세요.'; }
}
function openFromCode(code, extra){
  const r = makeReport(decodeResult(code));
  const prev = extra && extra.raw;
  if(prev){ r.oral = {wrong:prev.wrong||[], wrongE:prev.wrongE||[], sec:prev.sec??null, style:prev.style||''}; r.note = extra.note||''; }
  curReport = r; tview='report'; render();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='dlgclose'){ closeDialog(); return; }
  if(act==='teacher'){ mode='teacher'; try{ location.hash='teacher'; }catch(e){} tview='list'; render(); if(tkey && configured() && listState==='idle') loadList(); return; }
  if(act==='tostudent'){ mode='student'; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} S=null; render(); return; }
  if(act==='load'){ tkey = ($('#tkey')||{}).value.trim(); try{ localStorage.setItem('tkey', tkey); }catch(e){} if(configured()) loadList(); else renderTeacher(); return; }
  if(act==='open'){ const r = listCache[+b.dataset.i]; try{ openFromCode(r.code, oralMap[r.id]); }catch(e){ showDialog('열 수 없어요','이 결과의 코드가 손상되었어요.'); } return; }
  if(act==='import'){
    const txt = ($('#paste')||{}).value || '';
    const m = txt.match(/<<([A-Za-z0-9+/=\s]+?)>>/) || txt.match(/([A-Za-z0-9+/=]{40,})/);
    try{ openFromCode((m?m[1]:'').replace(/\s/g,'')); }catch(e){ $('#impstat').textContent='코드를 읽지 못했어요. 전체를 붙여 넣었는지 확인해 주세요.'; }
    return;
  }
  if(act==='tlist'){ tview='list'; render(); return; }
  if(act==='saveoral'){ await saveOral(); return; }
  if(act==='ow' || act==='oe' || act==='ostyle'){
    keepTeacherInputs();
    const o = curReport.oral;
    if(act==='ostyle') o.style = b.dataset.v;
    else { const arr = act==='ow' ? o.wrong : o.wrongE, i=+b.dataset.i, k=arr.indexOf(i); k<0?arr.push(i):arr.splice(k,1); }
    const y = window.scrollY; renderReport($('#app'), curReport); window.scrollTo(0,y); return;
  }
  if(!S) return;
  const st = steps[si];
  if(act==='prev'){ collect(); if(si>0){ si--; while(si>0 && (steps[si].k==='checkpoint' || steps[si].k==='passage')) si--; } render(); return; }
  if(act==='next'){ collect(); if(si<steps.length-1) si++; render(); return; }
  if(act==='readdone'){ S.readSec = (Date.now()-S.readStart)/1000; si++; render(); return; }
  if(act==='pick'){ S.ans[st.id] = +b.dataset.i; render(); return; }
  if(act==='soundtest'){ if(!say('소리가 잘 들려요? 그럼 다음을 누르세요.')) showDialog('소리가 나지 않아요 · Нет звука','무음·진동 모드를 끄고 소리를 키운 뒤 다시 눌러요. 그래도 안 되면 선생님께 말해 주세요.<br><span class="ru">Выключи беззвучный режим и вибрацию, сделай громче и нажми ещё раз. Если не помогло, скажи учителю.</span>'); return; }
  if(act==='play'){ const s=b.dataset.s; S.plays[s]=(S.plays[s]||0)+1; render(); if(!say(DATA.stories[s])){ S.noSound[s]=true; render(); showDialog('소리가 나지 않아요 · Нет звука','선생님께 말해 주세요. 지금은 [문제 풀기]를 눌러 넘어가도 돼요.<br><span class="ru">Скажи учителю. Сейчас можно нажать «К вопросам».</span>'); } return; }
  if(act==='nosound'){ S.noSound[b.dataset.s]=true; render(); return; }
  if(act==='sayq'){ say(ITEMS[b.dataset.id].q); return; }
  if(act==='submit'){
    b.disabled = true; $('#sendstat').textContent = '보내는 중… · Отправляю…';
    try{
      if(!configured()) throw new Error('not configured');
      await postJSON(submitPayload());
      S.sent = true; render();
    }catch(e){
      b.disabled = false;
      $('#sendstat').textContent = '보내지 못했어요. 인터넷을 확인하고 다시 눌러 주세요. · Не получилось. Проверь интернет и нажми ещё раз.';
      const code = `[한국어 읽기 진단 결과]\n이름: ${S.name||'-'}\n<<${encodeResult(S)}>>`;
      $('#fallback').innerHTML = `<details><summary class="note">계속 안 되면 · Если снова не получается</summary>
        <p class="note">아래 글을 복사해 카카오톡으로 선생님께 보내요. · Скопируй текст ниже и отправь учителю в KakaoTalk.</p>
        <textarea readonly>${esc(code)}</textarea></details>`;
    }
    return;
  }
  if(act==='copyread'){
    const t = `[소리 내어 읽기 · Прочитай вслух]\n${CARD_WORDS.join('  ')}\n\n${PASSAGE}`;
    try{ await navigator.clipboard.writeText(t); $('#readstat').textContent='복사했어요! 카카오톡에 붙여 넣어요. · Скопировано!'; }
    catch(e){ $('#readstat').innerHTML = '아래 글을 직접 복사해요. · Скопируй текст:<br><textarea readonly>'+esc(t)+'</textarea>'; }
    return;
  }
});
document.addEventListener('change', ev => { if(ev.target.id==='osec' && curReport){ keepTeacherInputs(); const y=window.scrollY; renderReport($('#app'), curReport); window.scrollTo(0,y); } });
function collect(){ const nm=$('#nm'); if(nm && S) S.name = nm.value.trim(); }
window.addEventListener('hashchange', () => { const m = location.hash==='#teacher' ? 'teacher' : 'student'; if(m!==mode){ mode=m; render(); } });
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }catch(e){} }
render();
if(mode==='teacher' && tkey && configured()) loadList();

</script>
</body>
</html>
