<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중도입국 아이들의 한국어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Jua&display=swap">
<style>
:root{--paper:#F4F6F8;--card:#FFFFFF;--ink:#1D2430;--muted:#5A6472;--line:#CDD4DD;--accent:#2F5D8A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;word-break:keep-all}
main{max-width:640px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:'Jua',sans-serif;font-weight:400;font-size:34px;margin:0;line-height:1.3}
.ru{color:#36506B}
a.go{display:flex;flex-direction:column;gap:4px;background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:20px;text-decoration:none;color:var(--ink)}
a.go b{font-size:24px;color:var(--accent)}
a.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>한국어 공부방<br><span class="ru" style="font-size:22px">Учим корейский</span></h1>
  <a class="go" href="diagnosis/"><b>읽기 확인 시작하기</b><span class="ru">Начать проверку чтения</span><span>약 20분 · примерно 20 минут</span></a>
  <div class="soon"><b>공부하기</b> · Занятия<br>곧 열려요 · Скоро</div>
</main>
</body>
</html>
